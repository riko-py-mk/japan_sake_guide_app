name: Update Sake Rankings

on:
  schedule:
    # 05:00 JST = 20:00 UTC (UTC+9)
    - cron: '0 20 * * *'
  workflow_dispatch:   # allow manual re-run from the Actions tab

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated JSON

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest sake rankings
        run: python scripts/update_sake_rankings.py

      - name: Commit updated rankings
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add utils/sake_ranking_fallback.json
          # Only commit when the file actually changed
          git diff --cached --quiet || \
            git commit -m "chore: update sake rankings $(date -u +%Y-%m-%d) [skip ci]"
          git push
